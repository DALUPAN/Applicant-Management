<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Politics - Employee Registration Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f5f7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
   
    /* Header Banner matched with Food Politics theme */
    .brand-header {
      background-color: #2b2b2b;
      color: #ffffff;
      width: 100%;
      max-width: 750px;
      padding: 25px;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .brand-header img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
      padding: 4px;
    }
    .brand-title h2 { font-size: 20px; color: #fff; letter-spacing: 0.5px; }
    .brand-title p { font-size: 13px; color: #f39c12; margin-top: 4px; font-weight: bold; }
 
    /* Form Container */
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 750px;
      padding: 35px 40px;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
   
    .form-title {
      font-size: 18px;
      color: #222;
      margin-bottom: 25px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f4f5f7;
    }
 
    .form-row { display: flex; gap: 15px; margin-bottom: 18px; }
    .form-group { flex: 1; display: flex; flex-direction: column; }
    .form-group.full { width: 100%; margin-bottom: 18px; }
   
    label { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="date"], select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #8d85bf; }
   
    .radio-group { display: flex; gap: 20px; margin-top: 5px; }
    .radio-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #444; cursor: pointer; }
   
    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin: 25px 0 20px 0; font-size: 12px; color: #666; }
   
    .btn-submit {
      background-color: #8d85bf;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-submit:hover { background-color: #7971ab; }
  </style>
</head>
<body>
 
  <!-- Top Header Banner na may Logo integration -->
  <div class="brand-header">
    <img src="logo.png" alt="Food Politics Logo" onerror="this.onerror=function(){this.src='logo.jpg';}; this.src='logo.png';">
    <div class="brand-title">
      <h2>FOOD POLITICS</h2>
      <p>Job Application & Registration Portal</p>
    </div>
  </div>
 
  <!-- Main Form Body -->
  <div class="container">
    <h3 class="form-title">Employee Registration Form</h3>
 
    <form id="regForm" onsubmit="handleRegistration(event)">
      <!-- First Name, Last Name, Date of Birth -->
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="e.g. Juan" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="e.g. Dela Cruz" required>
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob" required>
        </div>
      </div>
 
      <!-- Phone Number & Email -->
      <div class="form-row">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="phone" placeholder="+63 900 000 0000" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="ex: myname@example.com" required>
        </div>
      </div>
 
      <!-- Gender -->
      <div class="form-group full">
        <label>Gender</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="gender" value="Female" checked> Female</label>
          <label class="radio-item"><input type="radio" name="gender" value="Male"> Male</label>
          <label class="radio-item"><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>
 
      <!-- Address -->
      <div class="form-group full">
        <label>Address</label>
        <input type="text" id="addr" placeholder="Enter your full address" required>
      </div>
 
      <!-- Applying Position -->
      <div class="form-group full">
        <label>Applying Position</label>
        <input type="text" id="position" placeholder="e.g. Barista, Kitchen Staff, Counter Staff" required>
      </div>
 
      <!-- Preferred Branch -->
      <div class="form-group full">
        <label>Preferred Branch</label>
        <select id="preferredBranch" required>
          <option value="Kenneth Branch">Kenneth Branch</option>
          <option value="Pinalad Branch">Pinalad Branch</option>
          <option value="San Lo Branch">San Lo Branch</option>
        </select>
      </div>
 
      <!-- Cover Letter -->
      <div class="form-group full">
        <label>Cover Letter or Additional Information</label>
        <textarea id="coverLetter" rows="3" placeholder="Tell us something about yourself..."></textarea>
      </div>
 
      <!-- Privacy Agreement -->
      <div class="checkbox-group">
        <input type="checkbox" id="privacy" required>
        <label for="privacy">By checking the box, you agree to the Privacy Policy and understand that any data you share is protected and secured.</label>
      </div>
 
      <button type="submit" class="btn-submit">SUBMIT APPLICATION</button>
    </form>
  </div>
 
  <script>
    function handleRegistration(e) {
      e.preventDefault();
 
      // 1. Kuhanin ang bawat input field value
      var fname = document.getElementById("firstName").value.trim();
      var lname = document.getElementById("lastName").value.trim();
      var fullName = fname + " " + lname;
     
      var dobVal = document.getElementById("dob").value;
      var phoneVal = document.getElementById("phone").value.trim();
      var emailVal = document.getElementById("email").value.trim();
      var addrVal = document.getElementById("addr").value.trim();
      var posVal = document.getElementById("position").value.trim();
      var branchVal = document.getElementById("preferredBranch").value;
      var coverVal = document.getElementById("coverLetter").value.trim();
 
      // Kuhanin ang gender value mula sa napiling radio option
      var genderVal = "Female";
      var genderRadios = document.getElementsByName("gender");
      for (var i = 0; i < genderRadios.length; i++) {
        if (genderRadios[i].checked) {
          genderVal = genderRadios[i].value;
          break;
        }
      }
 
      // 2. Kuhanin ang mga nakasave nang applicants sa localStorage
      var savedApplicants = localStorage.getItem("food_politics_applicants");
      var applicants = savedApplicants ? JSON.parse(savedApplicants) : [];
 
      // 3. Bumuo ng bagong Applicant ID (#APP-001, #APP-002, ...)
      var nextNum = applicants.length + 1;
      var newId = "#APP-" + String(nextNum).padStart(3, '0');
 
      // 4. Bumuo ng kumpletong applicant object
      var newApplicant = {
        id: newId,
        name: fullName,
        dob: dobVal !== "" ? dobVal : "N/A",
        gender: genderVal,
        phone: phoneVal !== "" ? phoneVal : "N/A",
        email: emailVal !== "" ? emailVal : "N/A",
        address: addrVal !== "" ? addrVal : "N/A",
        position: posVal,
        branch: branchVal,
        coverLetter: coverVal !== "" ? coverVal : "N/A",
        status: "Pending"
      };
 
      // 5. I-save sa shared localStorage key
      applicants.push(newApplicant);
      localStorage.setItem("food_politics_applicants", JSON.stringify(applicants));
 
      alert("Application Submitted Successfully!\nYour Applicant ID is: " + newId);
      document.getElementById("regForm").reset();
    }
  </script>
</body>
</html>
